<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-bubble-user {
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .chat-bubble-ai {
            background-color: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col justify-between">

    <!-- Top Header -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg">Nova</h1>
                <p class="text-xs text-emerald-400"><i class="fa-solid fa-circle text-[8px]"></i> Online Companion</p>
            </div>
        </div>
        
        <!-- Settings Modal Trigger -->
        <button onclick="toggleSettings()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>
    </header>

    <!-- Settings Drawer (Hidden by Default) -->
    <div id="settingsDrawer" class="hidden bg-slate-900 border-b border-slate-800 p-4 space-y-3">
        <h2 class="text-sm font-semibold text-slate-300">Companion Configuration</h2>
        <div>
            <label class="block text-xs text-slate-400 mb-1">OpenAI API Key (Saved in browser memory)</label>
            <input type="password" id="apiKeyInput" placeholder="sk-..." class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">System Personality / Prompt</label>
            <textarea id="systemPromptInput" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">You are Nova, an empathetic, helpful, and friendly AI companion. You reply concisely and warmly.</textarea>
        </div>
        <button onclick="saveSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded font-semibold">Save Settings</button>
    </div>

    <!-- Main Chat Window -->
    <main id="chatWindow" class="flex-1 p-4 overflow-y-auto space-y-4">
        <!-- AI Greeting -->
        <div class="flex gap-3 max-w-xl">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs shrink-0">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-bubble-ai p-3.5 rounded-2xl text-sm">
                Hi! I'm Nova, your AI companion. Open the gear icon above to add an API key and customize my personality, or start chatting below!
            </div>
        </div>
    </main>

    <!-- Message Input Bar -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chatForm" onsubmit="sendMessage(event)" class="flex items-center gap-2 max-w-4xl mx-auto">
            <input type="text" id="userInput" placeholder="Type a message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" required>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <!-- JavaScript Chat Logic -->
    <script>
        let chatHistory = [];

        // Load saved API Key & System Prompt on page load
        window.onload = () => {
            const savedKey = localStorage.getItem('companion_api_key');
            const savedPrompt = localStorage.getItem('companion_prompt');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            if (savedPrompt) document.getElementById('systemPromptInput').value = savedPrompt;
        };

        function toggleSettings() {
            const drawer = document.getElementById('settingsDrawer');
            drawer.classList.toggle('hidden');
        }

        function saveSettings() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const prompt = document.getElementById('systemPromptInput').value.trim();
            localStorage.setItem('companion_api_key', apiKey);
            localStorage.setItem('companion_prompt', prompt);
            alert('Settings saved!');
            toggleSettings();
        }

        async function sendMessage(event) {
            event.preventDefault();
            const inputField = document.getElementById('userInput');
            const userMessage = inputField.value.trim();
            if (!userMessage) return;

            const apiKey = localStorage.getItem('companion_api_key') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('Please enter an OpenAI API key in the settings gear icon to start chatting!');
                toggleSettings();
                return;
            }

            // Append User Message to UI
            appendMessage('user', userMessage);
            inputField.value = '';

            // Add user message to memory
            chatHistory.push({ role: 'user', content: userMessage });

            // Create loading placeholder
            const loadingId = appendLoadingMessage();

            try {
                const systemPrompt = localStorage.getItem('companion_prompt') || document.getElementById('systemPromptInput').value;
                
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...chatHistory
                        ]
                    })
                });

                const data = await response.json();
                removeLoadingMessage(loadingId);

                if (data.error) {
                    appendMessage('ai', `Error: ${data.error.message}`);
                } else {
                    const aiReply = data.choices[0].message.content;
                    appendMessage('ai', aiReply);
                    chatHistory.push({ role: 'assistant', content: aiReply });
                }
            } catch (err) {
                removeLoadingMessage(loadingId);
                appendMessage('ai', 'Error connecting to the AI service. Please check your network or API key.');
            }
        }

        function appendMessage(sender, text) {
            const chatWindow = document.getElementById('chatWindow');
            const wrapper = document.createElement('div');
            wrapper.className = sender === 'user' ? 'flex justify-end' : 'flex gap-3 max-w-xl';

            if (sender === 'user') {
                wrapper.innerHTML = `
                    <div class="chat-bubble-user p-3.5 rounded-2xl text-sm max-w-xl">
                        ${escapeHtml(text)}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs shrink-0">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="chat-bubble-ai p-3.5 rounded-2xl text-sm">
                        ${escapeHtml(text)}
                    </div>
                `;
            }

            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendLoadingMessage() {
            const id = 'loading-' + Date.now();
            const chatWindow = document.getElementById('chatWindow');
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex gap-3 max-w-xl';
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs shrink-0">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="chat-bubble-ai p-3.5 rounded-2xl text-sm italic text-slate-400">
                    Nova is thinking...
                </div>
            `;
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return id;
        }

        function removeLoadingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
